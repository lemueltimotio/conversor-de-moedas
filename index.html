<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="icon" type="./assets/logo.gif" href="./assets/logo.gif">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Conversor de moedas</title>
</head>

<body>
    <img src="assets/logo.gif" alt="logo-convert-money" class="logo">
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>

            </select>
        </label>
        <label>
            Valor
            <input class="input-currency" placeholder="R$ 0,00">
        </label>
        <button class="convert-button" >Converter</button>
        <section>
            <div class="currency-box">
                <img src="assets/realbras.png" alt="logo-moeda-real-brasileiro">
                <p class="currency">Real Brasileiro</p>
                <p class="currency-value-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="assets/Vector.png" alt="arrow">

            <div class="currency-box">
                <img src="assets/dolar.png" alt="logo-moeda-dolar-americano" id="currency-image">
                <p class="currency" id="currency-coverted">Dólar Americano</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
    </main>

</body>

</html>

<script src="./script.js"></script>
